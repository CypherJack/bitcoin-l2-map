<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>A Map of Bitcoin — Off-Chain Media</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light dark;
    --light--background: #ffffff;
    --dark--background:  hsla(0, 0%, 10%, 1);
    --light--text:       hsla(0, 0%, 10%, 1);
    --dark--text:        #ffffff;
    --bg:         light-dark(var(--light--background), var(--dark--background));
    --bg-2:       light-dark(#f2f2f2, hsla(0, 0%, 13%, 1));
    --bg-3:       light-dark(#e6e6e6, hsla(0, 0%, 16%, 1));
    --line:       light-dark(hsl(0, 0%, 78%), hsl(0, 0%, 20%));
    --line-strong:light-dark(hsl(0, 0%, 58%), hsl(0, 0%, 30%));
    --fg:         light-dark(var(--light--text), var(--dark--text));
    --fg-dim:     light-dark(hsl(0, 0%, 38%), hsl(0, 0%, 66%));
    --fg-dimmer:  light-dark(hsl(0, 0%, 55%), hsl(0, 0%, 44%));
    --btc: #f7931a;
    --cat-channel:     light-dark(oklch(0.45 0.15 230), oklch(0.74 0.13 230));
    --cat-lightning:   light-dark(oklch(0.55 0.20 85),  oklch(0.82 0.17 95));
    --cat-sidechain:   light-dark(oklch(0.45 0.15 150), oklch(0.76 0.13 150));
    --cat-rollup:      light-dark(oklch(0.42 0.22 25),  oklch(0.66 0.20 25));
    --cat-client:      light-dark(oklch(0.46 0.16 340), oklch(0.72 0.14 340));
    --cat-ecash:       light-dark(oklch(0.46 0.15 310), oklch(0.74 0.13 310));
    --cat-inscription: light-dark(oklch(0.48 0.16 55),  oklch(0.76 0.14 55));
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: 'Spectral', Georgia, serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.55;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr minmax(25%, 360px);
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "stage  panel"
      "footer footer";
  }

  /* ---- HEADER ---- */
  header {
    grid-area: header;
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    background: var(--bg);
    z-index: 5;
  }
  .masthead {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    letter-spacing: 0.22em;
    font-size: 11px;
    color: var(--fg-dim);
    text-transform: uppercase;
  }
  .masthead .rule { color: var(--fg-dimmer); margin: 0 10px; }
  h1 {
    margin: 4px 0 0;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  h1 em {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--fg-dim);
  }
  .header-meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-dimmer);
    letter-spacing: 0.04em;
  }
  .header-meta .k { color: var(--fg-dim); }

  /* ---- STAGE ---- */
  .stage {
    grid-area: stage;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at center, light-dark(hsl(0,0%,96%), hsl(0,0%,11%)) 0%, var(--bg) 60%);
  }
  .stage svg.edges {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .nodes-layer {
    position: absolute;
    inset: 0;
  }

  /* background type */
  .bg-type {
    position: absolute;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    color: light-dark(hsl(0, 0%, 88%), hsl(0, 0%, 12%));
    pointer-events: none;
    user-select: none;
    letter-spacing: -0.02em;
    line-height: 0.85;
  }
  .bg-type.top {
    top: 6%;
    left: 4%;
    font-size: clamp(60px, 9vw, 140px);
  }
  .bg-type.bottom {
    bottom: 4%;
    right: 4%;
    font-size: clamp(50px, 7vw, 110px);
    text-align: right;
  }
  .bg-type em {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-weight: 300;
    color: light-dark(hsl(0, 0%, 72%), hsl(0, 0%, 15%));
  }

  /* ---- Strata (architectural stack) ---- */
  .strata {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
    z-index: 8;
  }
  .app.mode-stack .strata { opacity: 1; }
  .app.mode-stack .bg-type { opacity: 0; }
  .app.mode-stack .stratum::before { display: none; }

  .stratum {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(var(--t) * 100%);
    height: 1px;
    display: block;
  }
  .stratum::before {
    content: '';
    position: absolute;
    left: 220px;
    right: 32px;
    top: 0;
    border-top: 1px dashed light-dark(hsl(0, 0%, 72%), hsl(0, 0%, 16%));
  }
  .stratum-rail {
    position: absolute;
    left: 16px;
    top: -14px;
    width: 200px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 2;
  }
  .stratum .tier-no {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.2em;
    color: var(--fg);
    background: var(--bg);
    padding: 4px 7px;
    border: 1px solid light-dark(hsl(0, 0%, 62%), hsl(0, 0%, 28%));
    flex: 0 0 auto;
  }
  .stratum .tier-name {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cat, var(--fg-dim));
    background: var(--bg);
    padding: 4px 10px;
    border: 1px solid color-mix(in oklab, var(--cat, var(--line-strong)) 40%, transparent);
    white-space: nowrap;
  }
  .stratum .stratum-rail[style*="--cat-lightning"] .tier-name { color: var(--fg); }
  .stratum.bedrock::before {
    border-top: 1px solid var(--btc);
    opacity: 0.45;
  }
  .stratum.bedrock .tier-no {
    color: var(--btc);
    border-color: hsla(33, 92%, 54%, 0.5);
  }
  .stratum.bedrock .tier-name { color: var(--fg); }

  /* Bedrock slab beneath bottom stratum */
  .bedrock-slab {
    position: absolute;
    left: 0; right: 0;
    top: 75%;
    height: 25%;
    background: hsla(33, 92%, 54%, 0.05);
    opacity: 0;
    transition: opacity 300ms ease;
    pointer-events: none;
    border-top: 1px solid hsla(33, 92%, 54%, 0.4);
  }
  .app.mode-stack .bedrock-slab { opacity: 1; }

  /* Stack mode: shrink non-btc/ln nodes */
  .app.mode-stack .node:not(.btc):not(.ln) .node-core {
    width: 56px;
    height: 56px;
    font-size: 18px;
  }
  .app.mode-stack .node .node-label .sub { display: none; }
  .app.mode-stack .node .node-label {
    font-size: 11px;
    letter-spacing: 0.10em;
    top: calc(100% + 10px);
  }

  /* Lightning as full-width communication rail */
  .app.mode-stack .node.ln .node-core {
    width: calc(var(--stage-w, 600px) * 0.65);
    height: 56px;
    border-radius: 2px;
    background: light-dark(color-mix(in oklab, var(--cat-lightning) 14%, var(--bg)), color-mix(in oklab, var(--cat-lightning) 3%, var(--bg)));
    border: 1px solid light-dark(color-mix(in oklab, var(--cat-lightning) 70%, transparent), color-mix(in oklab, var(--cat-lightning) 40%, transparent));
    box-shadow: none;
    overflow: hidden;
    padding: 0;
  }
  .app.mode-stack .node.ln .node-core::before,
  .app.mode-stack .node.ln .node-core::after { display: none; }
  .app.mode-stack .node.ln .node-label { display: none; }

  /* Bitcoin as wide blockchain slab */
  .app.mode-stack .node.btc .node-core {
    width: calc(var(--stage-w, 600px) * 0.8);
    height: 56px;
    border-radius: 2px;
    background: light-dark(color-mix(in oklab, var(--btc) 12%, var(--bg)), color-mix(in oklab, var(--btc) 3%, var(--bg)));
    border: 1px solid light-dark(color-mix(in oklab, var(--btc) 65%, transparent), color-mix(in oklab, var(--btc) 40%, transparent));
    box-shadow: none;
    overflow: hidden;
    padding: 0;
  }
  .app.mode-stack .node.btc .node-core::after,
  .app.mode-stack .node.btc .node-core::before { display: none; }
  .app.mode-stack .node.btc .node-label { display: none; }

  /* ---- Nodes ---- */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    user-select: none;
    transition: opacity 200ms ease;
    z-index: 4;
  }
  .node-core {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.02em;
    position: relative;
    transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .node-core::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1px solid var(--cat, var(--line));
    opacity: 0.55;
    transition: opacity 160ms ease, inset 160ms ease;
  }
  .node:hover .node-core { background: var(--bg-3); border-color: var(--cat, var(--fg-dim)); }
  .node:hover .node-core::after { opacity: 1; inset: -8px; }
  .node.active .node-core { background: var(--bg-3); border-color: var(--cat, var(--fg)); }
  .node.active .node-core::after { opacity: 1; inset: -9px; border-width: 1.5px; }

  .node-label {
    position: absolute;
    left: 50%;
    top: calc(100% + 14px);
    transform: translateX(-50%);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 12px;
    color: var(--fg);
    white-space: nowrap;
    text-align: center;
  }
  .node-label .sub {
    display: block;
    margin-top: 3px;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    font-size: 11px;
    color: var(--fg-dimmer);
  }

  /* Bitcoin center node */
  .node.btc .node-core {
    width: 124px; height: 124px;
    background: var(--bg-3);
    border-color: var(--btc);
    color: var(--btc);
    font-size: 48px;
  }
  .node.btc .node-core::after {
    inset: -10px;
    border: 1px solid hsla(33, 92%, 54%, 0.35);
  }
  .node.btc .node-core::before {
    content: '';
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed hsla(33, 92%, 54%, 0.18);
  }
  .node.btc .node-label {
    top: calc(100% + 18px);
    font-size: 14px;
    letter-spacing: 0.18em;
  }
  .node.btc:hover .node-core { transform: none; }

  /* Dim inactive nodes when one is selected */
  .app.has-active .node:not(.active):not(.related) { opacity: 0.22; }
  .app.has-active .node.related .node-core { border-color: var(--cat, var(--line-strong)); }

  /* ---- Edges ---- */
  .edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    transition: stroke 200ms ease, stroke-width 200ms ease, opacity 200ms ease;
  }
  .edge.dashed        { stroke-dasharray: 4 4; }
  .edge.dotted        { stroke-dasharray: 1.5 4; }
  .edge.cryptographic { stroke-dasharray: 10 5; }
  .app.has-active .edge { opacity: 0.15; }
  .app.has-active .edge.highlighted { opacity: 1; stroke: var(--cat, var(--fg)); stroke-width: 1.5; }

  .edge-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    fill: var(--fg-dimmer);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .app.has-active .edge-label.highlighted { opacity: 1; fill: var(--cat, var(--fg-dim)); }

  /* ---- PANEL ---- */
  .panel {
    grid-area: panel;
    border-left: 1px solid var(--line);
    background: var(--bg);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .panel-inner { padding: 24px 26px 28px; }

  .panel .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--fg-dim);
    border: 1px solid var(--cat, var(--line-strong));
    padding: 3px 8px;
    border-radius: 2px;
    margin-bottom: 14px;
  }
  .panel h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1;
    margin: 2px 0 4px;
    letter-spacing: 0.01em;
  }
  .panel .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: var(--fg-dimmer);
    text-transform: uppercase;
    margin: 0 0 10px;
  }
  .panel .tagline {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--fg-dim);
    font-size: 19px;
    margin: 0 0 18px;
  }

  .logo-slot {
    width: 100%;
    aspect-ratio: 16 / 7;
    background:
      repeating-linear-gradient(
        135deg,
        hsl(0, 0%, 11%) 0 6px,
        hsl(0, 0%, 9%) 6px 12px
      );
    border: 1px solid var(--line);
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: hsl(0, 0%, 96%);
    margin-bottom: 22px;
  }
  .logo-slot img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .logo-slot img.ln-detail-logo {
    width: 75%;
    max-width: none;
    max-height: none;
    transform: none;
  }
  .logo-slot.ln-logo-slot {
    overflow: hidden;
  }

  .panel p.body {
    font-size: 18px;
    line-height: 1.58;
    color: var(--fg);
    margin: 0 0 20px;
  }
  .panel p.body-cont::first-letter { all: unset; }
  .panel p.body::first-letter {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 47px;
    float: left;
    line-height: 0.9;
    margin: 4px 8px 0 0;
    color: var(--fg);
  }

  .panel .read-more {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--cat, var(--fg));
    text-decoration: none;
    border: 1px solid color-mix(in oklab, var(--cat, var(--fg-dim)) 50%, transparent);
    padding: 10px 14px;
    margin: 4px 0 24px;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .panel .read-more:hover {
    background: color-mix(in oklab, var(--cat, var(--fg)) 10%, transparent);
    border-color: var(--cat, var(--fg));
  }

  .specs {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: grid;
    grid-template-columns: 110px 1fr;
    row-gap: 11px;
    column-gap: 14px;
  }
  .specs dt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-dimmer);
    padding-top: 2px;
  }
  .specs dd {
    margin: 0;
    font-family: 'Spectral', serif;
    font-size: 18px;
    color: var(--fg);
  }
  .specs dd.mono { font-family: 'JetBrains Mono', monospace; font-size: 16px; }

  .bridge-line {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .bridge-line .lbl {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 10px;
  }
  .bridge-diagram {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: fit-content;
    margin: 0 auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--fg);
  }
  .bridge-diagram .hop {
    padding: 8px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: var(--bg-2);
    white-space: nowrap;
    margin: 4px 0;
  }
  .bridge-diagram .hop.btc { color: var(--btc); border-color: hsla(33, 92%, 54%, 0.5); }
  .bridge-diagram .arrow {
    width: 1px;
    height: 22px;
    background: var(--line-strong);
    position: relative;
    flex-shrink: 0;
    margin: 2px 0;
  }
  .bridge-diagram .arrow::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%) rotate(135deg);
    width: 6px; height: 6px;
    border-right: 1px solid var(--line-strong);
    border-top: 1px solid var(--line-strong);
  }

  /* Empty state */
  .panel .empty { padding: 22px 0 0; }
  .empty h3 {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin: 0 0 14px;
  }
  .empty p {
    font-family: 'Spectral', serif;
    font-size: 18px;
    color: var(--fg);
    margin: 0 0 14px;
  }
  .empty p em { color: var(--fg-dim); }
  .legend {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--fg);
    letter-spacing: 0.04em;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--c);
    background: color-mix(in oklab, var(--c) 25%, var(--bg));
    flex: 0 0 auto;
  }
  .legend-row .ct { color: var(--fg-dim); margin-left: auto; font-size: 14px; }

  /* ---- FOOTER ---- */
  footer {
    grid-area: footer;
    padding: 12px 28px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--fg-dimmer);
    text-transform: uppercase;
    background: var(--bg);
  }
  footer .nav { display: flex; gap: 22px; align-items: center; }
  footer .nav button {
    background: transparent;
    border: none;
    color: var(--fg-dim);
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 1px solid transparent;
  }
  footer .nav button.active { color: var(--fg); border-bottom-color: var(--fg); }
  footer .nav button:hover { color: var(--fg); }

  /* ---- TWEAKS PANEL ---- */
  .tweaks {
    position: absolute;
    bottom: 60px;
    right: 24px;
    width: 280px;
    background: var(--bg-2);
    border: 1px solid var(--line-strong);
    padding: 16px 18px 18px;
    z-index: 60;
    display: none;
    font-family: 'Spectral', serif;
  }
  .tweaks.open { display: block; }
  .tweaks .tk-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--fg);
    margin: 0 0 14px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .tweaks .tk-title .close {
    cursor: pointer; color: var(--fg-dimmer); font-family: 'JetBrains Mono', monospace; font-size: 14px;
  }
  .tk-row { margin-bottom: 14px; }
  .tk-row:last-child { margin-bottom: 0; }
  .tk-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 6px;
  }
  .tk-seg {
    display: flex;
    border: 1px solid var(--line-strong);
  }
  .tk-seg button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--fg-dim);
    padding: 7px 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-right: 1px solid var(--line-strong);
  }
  .tk-seg button:last-child { border-right: none; }
  .tk-seg button.active { background: var(--fg); color: var(--bg); }
  .tk-seg button:not(.active):hover { color: var(--fg); }

  .tk-toggle {
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Spectral', serif;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
  }
  .tk-toggle input { display: none; }
  .tk-toggle .sw {
    width: 32px; height: 18px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    position: relative;
    transition: all 160ms ease;
  }
  .tk-toggle .sw::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--fg-dim);
    transition: all 160ms ease;
  }
  .tk-toggle input:checked + .sw { border-color: var(--fg); }
  .tk-toggle input:checked + .sw::after { left: 16px; background: var(--fg); }

  /* No-ring utility */
  .node.no-ring .node-core::after { display: none; }

  /* Scrollbar */
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-track { background: var(--bg); }
  .panel::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

  /* ---- PANEL CLOSE BUTTON (hidden on desktop) ---- */
  .panel-close {
    display: none;
  }

  /* ---- MOBILE ---- */
  @media (max-width: 768px) {
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    .app {
      position: relative;
      inset: auto;
      height: 100%;
      min-height: 0;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header"
        "stage"
        "info-bar";
    }

    .panel {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: none;
      border-top: none;
      display: flex;
      overflow-y: auto;
    }

    .panel.panel-open {
      transform: translateX(0);
    }

    .panel .tagline {
      font-size: 17px;
    }

    .panel p.body,
    .empty p {
      font-size: 16px;
      line-height: 1.55;
    }

    .panel p.body::first-letter {
      float: none;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: inherit;
      margin: 0;
      color: inherit;
    }

    .specs dd {
      font-size: 16px;
    }

    .specs dd.mono {
      font-size: 14px;
    }

    .panel-close {
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      left: 0;
      z-index: 10;
      width: 44px;
      height: 44px;
      margin: 12px 0 0 12px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--fg);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .panel-close:hover {
      background: var(--line-strong);
    }

    /* Stratum labels → top-left of each section on mobile */
    .stratum::before {
      left: 0;
      right: 0;
    }

    .stratum-rail {
      top: 0;
      left: 12px;
      right: auto;
      width: auto;
      bottom: auto;
      justify-content: flex-start;
    }

    .stratum-rail .tier-name {
      white-space: nowrap !important;
      font-size: 9.5px;
      letter-spacing: 0.14em;
      padding: 3px 8px;
    }

    .stratum-rail br {
      display: none;
    }

    /* Smaller nodes on mobile */
    .node-core {
      width: 52px;
      height: 52px;
      font-size: 18px;
    }

    .app.mode-stack .node:not(.btc):not(.ln) .node-core {
      width: 44px;
      height: 44px;
    }

    .node-label {
      font-size: 10px;
      top: calc(100% + 8px);
    }

    /* info-bar: compact row, no scroll */
    .info-bar {
      display: flex !important;
      flex-direction: row !important;
      overflow: hidden;
      max-height: none;
      border-top: 1px solid var(--line);
      gap: 0;
    }
    .info-bar-col {
      border-right: 1px solid var(--line);
      border-bottom: none;
      padding: 8px 10px;
    }
    .info-bar-col:last-child { border-right: none; }
    .info-bar-col h3 {
      font-size: 9px;
      margin: 0 0 4px;
    }
    .info-bar-col p {
      font-size: 11px;
      line-height: 1.35;
    }
    .info-bar-col .legend-row {
      font-size: 10px;
      margin-bottom: 2px;
      gap: 5px;
    }

    /* Strata mobile positions are set by JS (see TIERS + layoutAll) */
  }

  /* Info bar — desktop: masqué */
  .info-bar {
    display: none;
    grid-area: info-bar;
    flex-direction: row;
    background: var(--bg);
    border-top: 1px solid var(--line);
    overflow: visible;
    max-height: none;
  }
  .info-bar-col {
    flex: 1;
    padding: 16px 14px;
    border-right: 1px solid var(--line);
  }
  .info-bar-col:last-child { border-right: none; }
  .info-bar-col h3 {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin: 0 0 10px;
  }
  .info-bar-col p {
    font-size: 15px;
    line-height: 1.55;
    color: var(--fg);
    margin: 0;
  }
  .info-bar-col p em { font-style: italic; color: var(--fg-dim); }
  .info-bar-col .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--fg);
  }
</style>
</head>

// ── Wide-slab generators ─────────────────────────────────────────
function renderBtcSlab(width) {
  const bw = 58, bh = 32, gap = 14, startX = 10, cy = 28;
  const firstBlock = 886421;
  const hashes = ['3f9a…c1d2','a7c1…b89f','d4e2…07fa','5b3c…e41a','9f1d…a35c','8e4a…2f1b','c2d7…6b4e','f8a1…9c3d','b6e3…4a2c','7d9f…1b5e','e2c4…8f3a','4a8b…d7c1'];
  const count = Math.max(1, Math.floor((width - startX * 2 + gap) / (bw + gap)));
  const totalContentW = count * bw + (count - 1) * gap;
  const offsetX = Math.round((width - totalContentW) / 2);
  let svg = `<svg width="100%" height="56" viewBox="0 0 ${width} 56" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  for (let i = 0; i < count; i++) {
    const num = firstBlock + i;
    const x = offsetX + i * (bw + gap);
    if (i > 0) {
      const ax = x - 10;
      svg += `<line x1="${ax - 6}" y1="${cy}" x2="${ax}" y2="${cy}" stroke="#f7931a" stroke-opacity="0.5" stroke-width="1"/>`;
      svg += `<polygon points="${ax},${cy-3} ${ax+5},${cy} ${ax},${cy+3}" fill="#f7931a" fill-opacity="0.5"/>`;
    }
    svg += `<rect x="${x}" y="${cy - bh/2}" width="${bw}" height="${bh}" rx="1" stroke="#f7931a" stroke-opacity="0.55" fill="hsla(33,92%,54%,0.06)"/>`;
    svg += `<text x="${x + bw/2}" y="${cy - 5}" text-anchor="middle" fill="#f7931a" fill-opacity="0.75" font-family="JetBrains Mono,monospace" font-size="7.5" letter-spacing="0.06em">#${num.toLocaleString()}</text>`;
    svg += `<text x="${x + bw/2}" y="${cy + 8}" text-anchor="middle" fill="#f7931a" fill-opacity="0.38" font-family="JetBrains Mono,monospace" font-size="6.5">${hashes[i % hashes.length]}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

function renderLnMesh(width) {
  const c = 'oklch(0.82 0.17 95)';
  const halfPeriod = 34;
  const padX = 20;
  // Count how many groups fit (must be odd so it starts and ends on a single)
  let groupCount = Math.floor((width - padX * 2) / halfPeriod) + 1;
  if (groupCount < 1) groupCount = 1;
  if (groupCount % 2 === 0) groupCount -= 1;
  const totalW = (groupCount - 1) * halfPeriod;
  const startX = (width - totalW) / 2;
  const groups = [];
  const lnNodes = [];
  for (let i = 0; i < groupCount; i++) {
    const x = startX + i * halfPeriod;
    const group = [];
    if (i % 2 === 0) {
      group.push(lnNodes.length);
      lnNodes.push({x, y: 28});
    } else {
      group.push(lnNodes.length);
      lnNodes.push({x, y: 14});
      group.push(lnNodes.length);
      lnNodes.push({x, y: 42});
    }
    groups.push(group);
  }
  const channels = [];
  for (let g = 0; g < groups.length - 1; g++) {
    groups[g].forEach(a => {
      groups[g + 1].forEach(b => {
        channels.push([a, b]);
      });
    });
  }
  let svg = `<svg width="100%" height="56" viewBox="0 0 ${width} 56" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">`;
  channels.forEach(([a, b]) => {
    const na = lnNodes[a], nb = lnNodes[b];
    svg += `<line x1="${na.x}" y1="${na.y}" x2="${nb.x}" y2="${nb.y}" stroke="${c}" stroke-opacity="0.30" stroke-width="0.8"/>`;
  });
  lnNodes.forEach(nd => {
    svg += `<circle cx="${nd.x}" cy="${nd.y}" r="3.5" fill="hsla(210,70%,60%,0.15)" stroke="${c}" stroke-opacity="0.85" stroke-width="1"/>`;
  });
  svg += `</svg>`;
  return svg;
}

function updateWideSlabs(stageWidth) {
  const slabWidth = Math.max(200, Math.round(stageWidth * 0.8));
  const ln = nodesLayer.querySelector('[data-id="ln"] .node-core');
  const btc = nodesLayer.querySelector('[data-id="btc"] .node-core');
  if (ln) ln.innerHTML = renderLnMesh(slabWidth);
  if (btc) btc.innerHTML = renderBtcSlab(slabWidth);
}

// ── Layout positions ─────────────────────────────────────────────
function stackPositions(stageWidth, stageHeight) {
  const pos = {};
  const isMobile = stageWidth && stageWidth < 769;

  // X distribution (unchanged)
  const minXNorm = isMobile ? 0.15 : (stageWidth ? (16 + 200 + 28 + 12) / stageWidth : 0.28);
  const maxXNorm = isMobile ? 0.85 : 0.84;
  const colX = (i, n) => minXNorm + (i / (n - 1)) * (maxXNorm - minXNorm);

  // Y positions
  if (isMobile && stageHeight) {
    // Mobile: nodes hug their tier label with a fixed pixel gap.
    // Label bottom ≈ 18px below label top. Gap ≈ 12px. Node half-height ≈ 22px.
    // So node center = labelTop + 50px (fixed, doesn't scale with stage).
    // BTC exception: connections arrive from above, keep spacious.
    const LABEL_TO_NODE = 50;
    const labelTopPx = r => (r * 0.25 + 0.02) * stageHeight;
    const nodeY = r => (labelTopPx(r) + LABEL_TO_NODE) / stageHeight;

    pos.btc = { x: 0.50, y: 0.90 };
    pos.ln  = { x: 0.50, y: nodeY(2) };

    const tier15Order = ['ark', 'spark', 'rgb', 'bitvm', 'ordinals'];
    const tier15 = tier15Order.filter(id => NODES.find(n => n.id === id));
    tier15.forEach((id, i) => {
      pos[id] = { x: colX(i, tier15.length), y: nodeY(1) };
    });

    const tier2 = NODES.filter(n => n.tier === 2).map(n => n.id);
    tier2.forEach((id, i) => {
      pos[id] = { x: colX(i, tier2.length), y: nodeY(0) };
    });
  } else {
    // Desktop: percentage-based (unchanged)
    const ty = TIER_Y.desktop;
    pos.btc = { x: 0.50, y: ty.node[3] };
    pos.ln  = { x: 0.50, y: ty.node[2] };

    const tier15Order = ['ark', 'spark', 'rgb', 'bitvm', 'ordinals'];
    const tier15 = tier15Order.filter(id => NODES.find(n => n.id === id));
    tier15.forEach((id, i) => {
      pos[id] = { x: colX(i, tier15.length), y: ty.node[1] };
    });

    const tier2 = NODES.filter(n => n.tier === 2).map(n => n.id);
    tier2.forEach((id, i) => {
      pos[id] = { x: colX(i, tier2.length), y: ty.node[0] };
    });
  }

  return pos;
}

// ── Render nodes (uses LOGOS registry) ────────────────────────────
function renderNodes() {
  nodesLayer.innerHTML = '';
  NODES.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node' + (n.id === 'btc' ? ' btc' : '') + (n.id === 'ln' ? ' ln' : '');
    el.dataset.id = n.id;
    if (n.category) el.style.setProperty('--cat', `var(${CATEGORIES[n.category].css})`);
    if (n.id === 'ln') el.style.setProperty('--cat', 'var(--cat-lightning)');

    const core = document.createElement('div');
    core.className = 'node-core';

    if (n.id === 'btc') {
      core.innerHTML = renderBtcSlab(460);
    } else if (n.id === 'ln') {
      core.innerHTML = renderLnMesh(460);
    } else if (LOGOS[n.id]) {
      core.innerHTML = LOGOS[n.id].icon(22, 22);
    } else {
      core.textContent = n.symbol;
    }

    el.appendChild(core);

    const lbl = document.createElement('div');
    lbl.className = 'node-label';
    lbl.innerHTML = `${n.name}<span class="sub">${n.id === 'btc' ? 'Layer 1' : CATEGORIES[n.category]?.label || ''}</span>`;
    el.appendChild(lbl);

    el.addEventListener('mouseenter', () => hoverNode(n.id));
    el.addEventListener('mouseleave', () => hoverNode(null));
    el.addEventListener('click', () => selectNode(n.id));
    nodesLayer.appendChild(el);
  });
}

// ── Layout ───────────────────────────────────────────────────────
function layoutAll() {
  const { width, height } = stage.getBoundingClientRect();
  stage.style.setProperty('--stage-w', width + 'px');
  const isMobile = width < 769;

  // Update strata positions from JS (single source of truth)
  TIERS.forEach(t => {
    const el = document.querySelector(`.stratum.${t.id}`);
    if (el) el.style.setProperty('--t', TIER_Y[isMobile ? 'mobile' : 'desktop'].label(t.row));
  });

  const norm = stackPositions(width, height);
  NODES.forEach(n => {
    const p = norm[n.id];
    state.px[n.id] = { x: p.x * width, y: p.y * height };
  });
  applyPositions();
  updateWideSlabs(width);
  drawEdges();
}

function applyPositions() {
  NODES.forEach(n => {
    const el = nodesLayer.querySelector(`[data-id="${n.id}"]`);
    if (!el) return;
    const p = state.px[n.id];
    el.style.left = p.x + 'px';
    el.style.top  = p.y + 'px';
  });
}

    // Between LN slab bottom (top of band) and BTC slab top (bottom of band)
    btc_up: {
      yMin: lnPx.y + slabHalfH + 6,
      yMax: btcPx.y - slabHalfH - 6,
    },
    // Between Native Primitives node bottoms and LN slab top
    ln_up: {
      yMin: Y_NP + nodeR + 6,
      yMax: lnPx.y - slabHalfH - 6,
    },
  };

  // Attach line endpoint. Slab side: angle the line so it is perpendicular for
  // nodes above the slab center and up to ±20° for nodes at the slab edges.
  // Node side: line starts from node center (hidden under the node icon).
  const MAX_TILT_BTC = 20 * Math.PI / 180;
  const MAX_TILT_LN  = 10 * Math.PI / 180;
  function attach(id, otherId) {
    const p = state.px[id];
    const other = state.px[otherId];
    if (id === 'btc' || id === 'ln') {
      const slabY = (other.y < p.y) ? p.y - slabHalfH : p.y + slabHalfH;
      const otherIsSlab = otherId === 'btc' || otherId === 'ln';
      if (otherIsSlab) {
        // Both slabs → vertical line at shared center
        return { x: p.x, y: slabY };
      }
      const dxNorm = Math.max(-1, Math.min(1, (other.x - p.x) / slabHalfW));
      const maxTilt = id === 'btc' ? MAX_TILT_BTC : MAX_TILT_LN;
      const angle = -dxNorm * maxTilt; // right-of-center node → line leans left as it descends
      const dy = slabY - other.y;
      return { x: other.x + Math.tan(angle) * dy, y: slabY };
    }
    // Node endpoint: start from center (line hidden under node)
    return { x: p.x, y: p.y };
  }

  // Build items: geometry + category color
  const items = [];
  EDGES.forEach(e => {
    const A = state.px[e.from], B = state.px[e.to];
    if (!A || !B) return;
    const p1 = attach(e.from, e.to);
    const p2 = attach(e.to, e.from);
    const fromNode = NODES.find(n => n.id === e.from);
    const toNode   = NODES.find(n => n.id === e.to);
    const catKey   = fromNode.category || toNode.category;
    let edgeColor = catKey ? `var(${CATEGORIES[catKey].css})` : 'var(--btc)';
    // LN-connected edges (including btc↔ln) use the Lightning yellow
    if (e.from === 'ln' || e.to === 'ln') edgeColor = 'var(--cat-lightning)';
    items.push({ e, p1, p2, edgeColor });
  });

  // Draw paths
  items.forEach(it => {
    const { e, p1, p2 } = it;
    let d;
    if (state.edge === 'curved') {
      const cxm = (p1.x + p2.x) / 2, cym = (p1.y + p2.y) / 2;
      const cx = width / 2, cy = height / 2;
      const nx = cym - cy, ny = -(cxm - cx);
      const nlen = Math.hypot(nx, ny) || 1;
      const offset = 36;
      const bx = cxm + (nx / nlen) * offset;
      const by = cym + (ny / nlen) * offset;
      d = `M ${p1.x} ${p1.y} Q ${bx} ${by} ${p2.x} ${p2.y}`;
    } else {
      d = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
    }
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'edge ' + (e.style || 'solid'));
    path.dataset.from = e.from;
    path.dataset.to   = e.to;
    if (e.secondary) path.setAttribute('opacity', '0.7');
    edgesSvg.appendChild(path);
  });

  // Pick label zone for each edge
  const zoneFor = e => (e.from === 'btc') ? 'btc_up'
                     : (e.from === 'ln')  ? 'ln_up'
                     : null;

  // Create label DOM elements (position set later via shelf placement)
  items.forEach(it => {
    const { e, edgeColor, p1, p2 } = it;
    const tg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    tg.setAttribute('class', 'edge-label' + (e.secondary ? ' secondary' : ''));
    tg.dataset.from = e.from;
    tg.dataset.to   = e.to;
    tg.style.setProperty('--cat', edgeColor);
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.textContent = e.kind;
    txt.setAttribute('x', 0); txt.setAttribute('y', 0);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dy', '0.35em');
    tg.appendChild(txt);
    edgesSvg.appendChild(tg);
    const bbox = txt.getBBox();
    const padX = 6, padY = 4;
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', bbox.x - padX);
    bg.setAttribute('y', bbox.y - padY);
    bg.setAttribute('width',  bbox.width  + padX * 2);
    bg.setAttribute('height', bbox.height + padY * 2);
    bg.setAttribute('fill', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'hsl(0,0%,9%)' : 'hsl(0,0%,94%)');
    bg.style.stroke = edgeColor;
    bg.setAttribute('stroke-width', '1');
    tg.insertBefore(bg, txt);
    it.g = tg;
    it.halfW = bbox.width / 2 + padX;
    it.halfH = bbox.height / 2 + padY;
    it.zone = zoneFor(e);
    // Default placement at edge midpoint (used for non-zoned edges)
    it.labelX = (p1.x + p2.x) / 2;
    it.labelY = (p1.y + p2.y) / 2;
  });

  // Shelf-based placement inside each zone:
  // labels sit on horizontal shelves, each label pinned to x where its line
  // crosses the shelf y — staying ON the connection line.
  Object.entries(ZONE).forEach(([zkey, Z]) => {
    const zItems = items.filter(it => it.zone === zkey);
    if (!zItems.length) return;

    const shelfStep = 26;
    const zoneH = Z.yMax - Z.yMin;
    const shelfCount = Math.max(1, Math.floor(zoneH / shelfStep));
    const shelfYs = [];
    for (let i = 0; i < shelfCount; i++) {
      shelfYs.push(Z.yMin + (zoneH - (shelfCount - 1) * shelfStep) / 2 + i * shelfStep);
    }

    // Sort by where each line crosses zone center — stable left-to-right order
    const zC = (Z.yMin + Z.yMax) / 2;
    zItems.forEach(it => {
      const dy = it.p2.y - it.p1.y;
      const t = dy ? (zC - it.p1.y) / dy : 0.5;
      const tC = Math.max(0.08, Math.min(0.92, t));
      it._sortX = it.p1.x + tC * (it.p2.x - it.p1.x);
    });
    zItems.sort((a, b) => a._sortX - b._sortX);

    // Greedy: for each label, try shelves (closest to source first) and pick
    // the first where it doesn't horizontally overlap already-placed labels.
    const shelfOccupants = shelfYs.map(() => []);
    zItems.forEach(it => {
      let placed = false;
      for (let s = 0; s < shelfCount; s++) {
        const sy = shelfYs[s];
        const dy = it.p2.y - it.p1.y;
        const t = dy ? (sy - it.p1.y) / dy : 0.5;
        const tC = Math.max(0.05, Math.min(0.95, t));
        const lx = it.p1.x + tC * (it.p2.x - it.p1.x);
        const leftX = lx - it.halfW, rightX = lx + it.halfW;
        const conflicts = shelfOccupants[s].some(o => !(rightX + 4 < o.l || leftX > o.r + 4));
        if (!conflicts) {
          shelfOccupants[s].push({ l: leftX, r: rightX });
          it.labelX = lx;
          it.labelY = sy;
          placed = true;
          break;
        }
      }
      if (!placed) {
        // Fallback: use topmost shelf and accept the overlap
        const sy = shelfYs[shelfCount - 1];
        const dy = it.p2.y - it.p1.y;
        const t = dy ? (sy - it.p1.y) / dy : 0.5;
        const tC = Math.max(0.05, Math.min(0.95, t));
        it.labelX = it.p1.x + tC * (it.p2.x - it.p1.x);
        it.labelY = sy;
      }
    });
  });

  // Apply final positions
  items.forEach(it => {
    it.g.setAttribute('transform', `translate(${it.labelX},${it.labelY})`);
  });

  syncHighlight();
}


// ── Hover / select ───────────────────────────────────────────────
function hoverNode(id) {
  if (state.active) return;
  setFocus(id);
  if (id) renderPanel(id);
  else renderEmptyPanel();
}

function selectNode(id) {
  state.active = state.active === id ? null : id;
  setFocus(state.active || id);
  if (state.active) { renderPanel(state.active); document.getElementById('panel').classList.add('panel-open'); }
  else { renderEmptyPanel(); document.getElementById('panel').classList.remove('panel-open'); }
}

document.getElementById('panel-close').addEventListener('click', () => {
  state.active = null;
  setFocus(null);
  renderEmptyPanel();
  document.getElementById('panel').classList.remove('panel-open');
});

function setFocus(id) {
  app.classList.toggle('has-active', !!id);
  nodesLayer.querySelectorAll('.node').forEach(el => el.classList.remove('active', 'related'));
  if (!id) { syncHighlight(); return; }

  const activeEl = nodesLayer.querySelector(`[data-id="${id}"]`);
  if (activeEl) activeEl.classList.add('active');

  const related = new Set();
  EDGES.forEach(e => {
    if (e.from === id) related.add(e.to);
    if (e.to   === id) related.add(e.from);
  });
  related.forEach(rid => {
    const el = nodesLayer.querySelector(`[data-id="${rid}"]`);
    if (el) el.classList.add('related');
  });

  syncHighlight(id);
}

function syncHighlight(focusId) {
  edgesSvg.querySelectorAll('.edge').forEach(el => el.classList.remove('highlighted'));
  edgesSvg.querySelectorAll('.edge-label').forEach(el => el.classList.remove('highlighted'));
  if (!focusId) return;

  edgesSvg.querySelectorAll('.edge').forEach(el => {
    if (el.dataset.from === focusId || el.dataset.to === focusId) {
      el.classList.add('highlighted');
      const otherId = el.dataset.from === focusId ? el.dataset.to : el.dataset.from;
      const other = NODES.find(n => n.id === otherId);
      const self  = NODES.find(n => n.id === focusId);
      let color = focusId === 'btc'
        ? (other.category ? `var(${CATEGORIES[other.category].css})` : 'var(--btc)')
        : (self.category  ? `var(${CATEGORIES[self.category].css})`  : 'var(--btc)');
      if (focusId === 'ln' || otherId === 'ln') color = 'var(--cat-lightning)';
      el.style.setProperty('--cat', color);
    }
  });
  edgesSvg.querySelectorAll('.edge-label').forEach(el => {
    if (el.dataset.from === focusId || el.dataset.to === focusId) {
      el.classList.add('highlighted');
    }
  });
}

// ── Panel (uses LOGOS registry — no more if/else chain) ──────────
function renderPanel(id) {
  const n = NODES.find(x => x.id === id);
  if (!n) { renderEmptyPanel(); return; }

  const cat = n.category ? CATEGORIES[n.category] : null;
  const catColor = cat ? `var(${cat.css})` : 'var(--btc)';

  panelInner.style.setProperty('--cat', catColor);
  panelInner.innerHTML = `
    <div class="tag" style="--cat:${catColor}; border-color:${catColor}; color:${catColor};">
      ${n.id === 'btc' ? S.l1Tag : cat.label}
    </div>
    <h2>${n.name}</h2>
    ${n.subtitle ? `<div class="subtitle">${n.subtitle}</div>` : ''}
    <div class="tagline">${n.tagline}</div>
    <div class="logo-slot">
      ${LOGOS[n.id] ? LOGOS[n.id].detail(80, 80) : `[ ${n.name} ]`}
    </div>
    ${n.body.split('\n\n').map((p, i) => `<p class="body${i > 0 ? ' body-cont' : ''}">${p}</p>`).join('')}
    <a class="read-more" href="${n.learnMore || '#'}" target="_blank" rel="noopener">${S.readMore} ${n.name} →</a>
    <dl class="specs">
      <dt>${S.roleLabel}</dt><dd>${n.short}</dd>
      <dt>Consensus</dt><dd class="mono">${n.consensus}</dd>
      ${n.bridge ? `<dt>Bridge</dt><dd>${n.bridge}</dd>` : ''}
    </dl>
    ${n.bridgePath ? `
      <div class="bridge-line">
        <div class="lbl">${S.pegMechanism}</div>
        <div class="bridge-diagram">
          ${n.bridgePath.map((h, i) => `
            <div class="hop ${i === 0 ? 'btc' : ''}">${h}</div>
            ${i < n.bridgePath.length - 1 ? '<div class="arrow"></div>' : ''}
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
}

function renderEmptyPanel() {
  panelInner.innerHTML = `
    <div class="empty">
      <h3>${S.readMap}</h3>
      <p>${S.readMapBody}<em>${S.readMapEm}</em>.</p>
      <div class="legend">
        <h3>${S.legendTitle}</h3>
        <div class="legend-row"><svg width="40" height="6"><line x1="0" y1="3" x2="40" y2="3" stroke="#aaa" stroke-width="1"/></svg><span>${S.legendNative}</span></div>
        <div class="legend-row"><svg width="40" height="6"><line x1="0" y1="3" x2="40" y2="3" stroke="#aaa" stroke-width="1" stroke-dasharray="4 4"/></svg><span>${S.legendFederated}</span></div>
        <div class="legend-row"><svg width="40" height="6"><line x1="0" y1="3" x2="40" y2="3" stroke="#aaa" stroke-width="1" stroke-dasharray="1.5 4"/></svg><span>${S.legendLN}</span></div>
        <div class="legend-row"><svg width="40" height="6"><line x1="0" y1="3" x2="40" y2="3" stroke="#aaa" stroke-width="1" stroke-dasharray="10 5"/></svg><span>${S.legendCrypto}</span></div>
      </div>
    </div>`;
}

// ── Tweaks ────────────────────────────────────────────────────────
function applyToggles() {
  nodesLayer.querySelectorAll('.node-label').forEach(l => l.style.display = state.labels ? '' : 'none');
  nodesLayer.querySelectorAll('.node').forEach(n => n.classList.toggle('no-ring', !state.rings));
  document.querySelectorAll('.bg-type').forEach(b => b.style.display = state.bgtype ? '' : 'none');
}

function setEdge(v) {
  state.edge = v;
  drawEdges();
  document.querySelectorAll('[data-group="edge"] button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
}

const tkPanel = document.getElementById('tweaks');
document.getElementById('tk-open').addEventListener('click', () => tkPanel.classList.toggle('open'));
document.getElementById('tk-close').addEventListener('click', () => tkPanel.classList.remove('open'));

document.querySelectorAll('[data-group="edge"] button').forEach(b => {
  b.addEventListener('click', () => setEdge(b.dataset.v));
});

['labels', 'rings', 'bgtype'].forEach(key => {
  const input = document.getElementById('tk-' + key);
  input.checked = state[key];
  input.addEventListener('change', () => {
    state[key] = input.checked;
    applyToggles();
  });
});

// ── Resize handler ───────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(layoutAll, 80);
});

// ── Boot ─────────────────────────────────────────────────────────
renderNodes();
layoutAll();
applyToggles();
renderEmptyPanel();

// ── iframe auto-resize ───────────────────────────────────────────
function reportHeightToParent() {
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ type: 'iframeHeight', height: h }, '*');
}
window.addEventListener('load', reportHeightToParent);
new ResizeObserver(reportHeightToParent).observe(document.body);
</script>
</body>
